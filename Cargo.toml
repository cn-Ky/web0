[package]
name = "web0"
version = "2.0.0"
edition = "2021"
description = "Web0 - Turkce web guvenligi kesif ve denetim araci"
license = "MIT"

[[bin]]
name = "web0"
path = "src/main.rs"

[dependencies]
ureq = { version = "2.9", default-features = false, features = ["native-tls", "json"] }
native-tls = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
clap = { version = "4", features = ["derive"] }
x509-parser = "0.15"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_System_Console"] }

[profile.release]
opt-level = 2
strip = true
