[package]
name = "web0"
version = "2.0.0"
edition = "2021"
description = "Web0 - Turkce web guvenligi kesif ve denetim araci"
license = "MIT"

[[bin]]
name = "web0"
path = "src/main.rs"

[dependencies]
ureq = { version = "=2.9.6", default-features = false, features = ["native-tls", "json"] }
native-tls = "=0.2.11"
serde = { version = "=1.0.197", features = ["derive"] }
serde_json = "=1.0.114"
regex = "=1.10.3"
clap = { version = "=4.5.1", features = ["derive"] }
x509-parser = "=0.15.1"
# Asagidaki iki satir, yeni surumlerinin Rust 1.75'te derlenemeyen
# "edition2024" ozelligini gerektiren icu_normalizer zincirini zorla
# daha eski ve uyumlu bir url/idna surumune sabitler.
url = "=2.4.1"
idna = "=0.4.0"
time = "=0.3.23"
openssl = "=0.10.66"
openssl-sys = "=0.9.103"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.52.0", features = ["Win32_System_Console"] }

[profile.release]
opt-level = 2
strip = true
